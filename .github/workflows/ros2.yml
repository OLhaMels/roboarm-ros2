name: ROS 2 Jazzy
on: [push, pull_request, workflow_dispatch]
jobs:
  mock-system:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep libgpiod-dev python3-pytest python3-av tesseract-ocr tesseract-ocr-ukr tesseract-ocr-rus tesseract-ocr-osd
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy --skip-keys libgpiod-dev
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --executor sequential --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Offline and package tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/roboarm_nodes/test tests/test_description.py -q
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Mock ROS graph smoke test
        shell: bash
        env:
          ROS_DOMAIN_ID: 83
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tests/ros_smoke.py
      - name: Perception smoke test (QR, pose, TCP stream)
        shell: bash
        env:
          ROS_DOMAIN_ID: 84
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tests/perception_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-logs
          path: |
            ros_smoke.log
            perception_smoke.log
            perception_smoke_stream.png
            log/
