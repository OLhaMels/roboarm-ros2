controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/GripperActionController
arm_controller:
  ros__parameters:
    joints: [z_joint, rotation_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.002
      z_joint: {trajectory: 0.005, goal: 0.001}
      rotation_joint: {trajectory: 0.1, goal: 0.04}
gripper_controller:
  ros__parameters:
    joint: gripper_joint
    goal_tolerance: 0.001
    max_effort: 0.0
    allow_stalling: false
    stall_timeout: 5.0
    stall_velocity_threshold: 0.00001
